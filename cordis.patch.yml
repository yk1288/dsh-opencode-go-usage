# dsh-opencode-go-usage bundle patch: inserts its plugin row into the web profile
# roster. The bundle is the official dsh plugin shape — install it with
# `dsh plugin --profile <name> add <path-or-git-url>`.
#
# The single row mounts BOTH halves: the host side (quota fetching)
# and the browser side (the status badge under the sidebar, via the dsh.client declaration in package.json).
- insert:
    - id: opencode-go-usage
      name: 'dsh-opencode-go-usage'
